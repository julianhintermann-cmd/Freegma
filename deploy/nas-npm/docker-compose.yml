# =============================================================================
#  Freegma on a NAS behind Nginx Proxy Manager (NPM)
# =============================================================================
#  NPM terminates HTTPS (Let's Encrypt) and forwards to this host on port 19001.
#  NPM proxy host: http -> <NAS-IP>:19001, Websockets ON, SSL + Force SSL, and in
#  "Advanced":
#    client_max_body_size 350m; proxy_buffering off; proxy_request_buffering off;
#    proxy_read_timeout 3600s; proxy_send_timeout 3600s;
#
#  Folders:
#    /volume2/docker/freegma/postgres     database        (docker data)
#    /volume1/data/freegma/assets         images, fonts   (long-term data, owner 1001:1001)
#    /volume1/data/freegma/backups        backups         (long-term data)
#
#  Replace before the first start: PENPOT_SECRET_KEY and POSTGRES_PASSWORD (2x, same value).
#  Start:  sudo docker compose -p freegma -f docker-compose.yaml up -d
#  Admin:  sudo docker exec -it freegma-backend python3 manage.py create-profile
#  Open:   https://freegma.jucloudy.com
#  Versions: Penpot 2.18.3, PostgreSQL 15.19, Valkey 8.1.10, Freegma proxy sha-82848ec
# =============================================================================

name: freegma

x-flags: &penpot-flags
  PENPOT_FLAGS: >-
    disable-registration enable-login-with-password disable-email-verification
    disable-onboarding enable-prepl-server enable-mcp enable-access-tokens

x-public-uri: &penpot-public-uri
  PENPOT_PUBLIC_URI: https://freegma.jucloudy.com          # must match the NPM domain exactly

x-secret-key: &penpot-secret-key
  PENPOT_SECRET_KEY: CHANGE-ME-long-random-secret-key       # CHANGE

x-database: &penpot-database
  PENPOT_DATABASE_URI: postgresql://penpot-postgres/penpot
  PENPOT_DATABASE_USERNAME: penpot
  PENPOT_DATABASE_PASSWORD: CHANGE-ME-db-password            # CHANGE (same as below)

x-common: &common
  restart: unless-stopped
  networks: [freegma]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

networks:
  freegma:
    name: freegma_net

services:
  # --- Freegma branding proxy -----------------------------------------------
  freegma:
    <<: *common
    image: ghcr.io/julianhintermann-cmd/freegma:sha-82848ec
    container_name: freegma-proxy
    ports:
      - "19001:8080"     # Nginx Proxy Manager forwards here
    environment:
      FREEGMA_UPSTREAM: http://penpot-frontend:8080
      FREEGMA_PENPOT_VERSION: "2.18.3"
      FREEGMA_BRAND_NAME: Freegma
      FREEGMA_SHOW_ATTRIBUTION: "true"
      FREEGMA_MCP_BACKGROUND: "true"          # MCP keeps working when the tab is in the background
      FREEGMA_SES_OVERRIDE_TAMING: severe     # prevents Penpot's "toString is read-only" Internal Error
    depends_on:
      penpot-frontend: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/freegma/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --- Penpot (official images) ------------------------------------------------
  penpot-frontend:
    <<: *common
    image: penpotapp/frontend:2.18.3
    container_name: freegma-frontend
    volumes:
      - /volume1/data/freegma/assets:/opt/data/assets
    environment:
      <<: [*penpot-flags, *penpot-public-uri]
      PENPOT_HTTP_SERVER_MAX_BODY_SIZE: 367001600
      PENPOT_DISABLE_IPV6_LISTEN: "true"
    depends_on:
      penpot-backend: { condition: service_healthy }
      penpot-exporter: { condition: service_healthy }
      penpot-mcp: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /readyz HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  penpot-backend:
    <<: *common
    image: penpotapp/backend:2.18.3
    container_name: freegma-backend
    volumes:
      - /volume1/data/freegma/assets:/opt/data/assets
    environment:
      <<: [*penpot-flags, *penpot-public-uri, *penpot-secret-key, *penpot-database]
      PENPOT_REDIS_URI: redis://penpot-valkey/0
      PENPOT_OBJECTS_STORAGE_BACKEND: fs
      PENPOT_OBJECTS_STORAGE_FS_DIRECTORY: /opt/data/assets
      PENPOT_HTTP_SERVER_MAX_BODY_SIZE: 367001600
      PENPOT_HTTP_SERVER_MAX_MULTIPART_BODY_SIZE: 367001600
      PENPOT_TELEMETRY_ENABLED: "false"
      JVM_OPTS: "-Xmx1g"     # cap the Java heap (NAS RAM is shared with other apps)
      # Penpot opens 60 DB connections by default; plenty for a few users:
      PENPOT_DATABASE_MIN_POOL_SIZE: 4
      PENPOT_DATABASE_MAX_POOL_SIZE: 16
    depends_on:
      penpot-postgres: { condition: service_healthy }
      penpot-valkey: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:6060/readyz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 180s     # slow NAS CPUs need 1-2 min for the first start

  penpot-exporter:
    <<: *common
    image: penpotapp/exporter:2.18.3
    container_name: freegma-exporter
    environment:
      <<: [*penpot-flags, *penpot-public-uri, *penpot-secret-key]
      PENPOT_INTERNAL_URI: http://penpot-frontend:8080
      PENPOT_REDIS_URI: redis://penpot-valkey/0
    depends_on:
      penpot-valkey: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(6061,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  penpot-mcp:
    <<: *common
    image: penpotapp/mcp:2.18.3
    container_name: freegma-mcp
    environment:
      PENPOT_MCP_LOG_LEVEL: info
    healthcheck:
      test: ["CMD", "node", "-e", "const n=require('net');let ok=0;for(const p of [4401,4402])n.connect(p,'127.0.0.1').on('connect',()=>{if(++ok==2)process.exit(0)}).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  penpot-postgres:
    <<: *common
    image: postgres:15.19
    container_name: freegma-postgres
    stop_signal: SIGINT
    volumes:
      - /volume2/docker/freegma/postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_INITDB_ARGS: --data-checksums
      POSTGRES_DB: penpot
      POSTGRES_USER: penpot
      POSTGRES_PASSWORD: CHANGE-ME-db-password               # CHANGE (same as above)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U penpot -d penpot"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 10s

  penpot-valkey:
    <<: *common
    image: valkey/valkey:8.1.10
    container_name: freegma-valkey
    environment:
      VALKEY_EXTRA_FLAGS: --maxmemory 128mb --maxmemory-policy volatile-lfu
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
