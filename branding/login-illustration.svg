<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" fill="none">
  <!-- Freegma login illustration. Replace freely (SVG, shown at ~560px). -->
  <!-- soft backdrop -->
  <circle cx="320" cy="320" r="270" fill="#ff6a3d" opacity="0.08"/>
  <circle cx="320" cy="320" r="200" fill="#ff6a3d" opacity="0.07"/>

  <!-- artboard with selection -->
  <g transform="rotate(-6 320 300)">
    <rect x="150" y="150" width="340" height="250" rx="18" fill="#2b1a14" opacity="0.92"/>
    <rect x="150" y="150" width="340" height="250" rx="18" stroke="#ffb38a" stroke-width="3"/>
    <rect x="150" y="116" width="96" height="24" rx="6" fill="#ffb38a"/>
    <text x="162" y="134" font-family="'Work Sans', Arial, sans-serif" font-size="15" font-weight="600" fill="#2b1a14">Frame 1</text>
    <!-- content blocks -->
    <rect x="180" y="185" width="150" height="18" rx="9" fill="#ffd9b3"/>
    <rect x="180" y="215" width="105" height="12" rx="6" fill="#ffd9b3" opacity="0.55"/>
    <rect x="180" y="236" width="125" height="12" rx="6" fill="#ffd9b3" opacity="0.55"/>
    <rect x="180" y="300" width="120" height="44" rx="22" fill="#ff6a3d"/>
    <text x="211" y="328" font-family="'Work Sans', Arial, sans-serif" font-size="16" font-weight="600" fill="#fff">Create</text>
    <circle cx="405" cy="255" r="62" fill="#ff6a3d"/>
    <circle cx="405" cy="255" r="62" stroke="#fff" stroke-width="2" stroke-dasharray="6 6"/>
    <!-- selection handles -->
    <rect x="337" y="187" width="136" height="136" stroke="#2ec4b6" stroke-width="2.5"/>
    <rect x="331" y="181" width="12" height="12" rx="2" fill="#fff" stroke="#2ec4b6" stroke-width="2.5"/>
    <rect x="467" y="181" width="12" height="12" rx="2" fill="#fff" stroke="#2ec4b6" stroke-width="2.5"/>
    <rect x="331" y="317" width="12" height="12" rx="2" fill="#fff" stroke="#2ec4b6" stroke-width="2.5"/>
    <rect x="467" y="317" width="12" height="12" rx="2" fill="#fff" stroke="#2ec4b6" stroke-width="2.5"/>
    <rect x="352" y="334" width="106" height="22" rx="6" fill="#2ec4b6"/>
    <text x="363" y="350" font-family="'Work Sans', Arial, sans-serif" font-size="13" font-weight="600" fill="#0d2b28">124 × 124</text>
  </g>

  <!-- bezier path with nodes -->
  <path d="M92 470 C 170 380, 250 560, 340 470 S 500 400, 560 470" stroke="#ffb38a" stroke-width="4" stroke-linecap="round"/>
  <line x1="170" y1="380" x2="92" y2="470" stroke="#ffb38a" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="170" cy="380" r="7" fill="#ffb38a"/>
  <rect x="84" y="462" width="16" height="16" rx="3" fill="#fff" stroke="#ff6a3d" stroke-width="3"/>
  <rect x="332" y="462" width="16" height="16" rx="3" fill="#ff6a3d"/>
  <rect x="552" y="462" width="16" height="16" rx="3" fill="#fff" stroke="#ff6a3d" stroke-width="3"/>

  <!-- swatches -->
  <g transform="translate(70 120)">
    <rect width="64" height="196" rx="16" fill="#2b1a14" opacity="0.92"/>
    <circle cx="32" cy="34" r="18" fill="#ff6a3d"/>
    <circle cx="32" cy="80" r="18" fill="#ffb38a"/>
    <circle cx="32" cy="126" r="18" fill="#ffd9b3"/>
    <circle cx="32" cy="172" r="18" fill="#2ec4b6"/>
    <circle cx="32" cy="34" r="23" stroke="#fff" stroke-width="2"/>
  </g>

  <!-- type specimen -->
  <g transform="translate(470 470)">
    <rect width="120" height="84" rx="16" fill="#2b1a14" opacity="0.92"/>
    <text x="22" y="58" font-family="'Work Sans', Arial, sans-serif" font-size="44" font-weight="600" fill="#ffd9b3">Aa</text>
  </g>

  <!-- cursor -->
  <g transform="translate(430 360) rotate(-8)">
    <path d="M0 0 L0 58 L16 44 L27 68 L38 63 L27 40 L48 40 Z" fill="#fff" stroke="#2b1a14" stroke-width="3" stroke-linejoin="round"/>
    <rect x="44" y="58" width="58" height="24" rx="12" fill="#2ec4b6"/>
    <text x="56" y="75" font-family="'Work Sans', Arial, sans-serif" font-size="13" font-weight="600" fill="#0d2b28">You</text>
  </g>

  <!-- AI sparkle (MCP) -->
  <g transform="translate(540 120)" fill="#ff6a3d">
    <path d="M0 -34 C 4 -10, 10 -4, 34 0 C 10 4, 4 10, 0 34 C -4 10, -10 4, -34 0 C -10 -4, -4 -10, 0 -34 Z"/>
    <path transform="translate(-50 52) scale(0.45)" d="M0 -34 C 4 -10, 10 -4, 34 0 C 10 4, 4 10, 0 34 C -4 10, -10 4, -34 0 C -10 -4, -4 -10, 0 -34 Z" fill="#ffb38a"/>
  </g>
</svg>
